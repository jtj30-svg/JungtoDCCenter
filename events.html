<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="워싱턴미주정토회관 일정 — 정기법회, 법문, 수련회, 친교의 날. 누구에게나 열려 있습니다.">
<title data-ko="행사 · 워싱턴미주정토회관" data-en="Events · Washington Jungto Center">행사 · 워싱턴미주정토회관</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&display=swap">

<style>
  :root{
    --cream:#fff7ed; --surface:#ffffff; --surface-2:#fafafa;
    --ink:#171717; --ink-2:#4a5565; --ink-3:#99a1af;
    --brand:#fb923c; --brand-strong:#bb4d00; --brand-tint:#ffedd4;
    --border:#e5e7eb; --border-strong:#d1d5dc;
    --info-bg:#eff6ff; --info-ink:#0069a8;
    --shadow-sm:0 1px 2px rgba(23,23,23,.05);
    --shadow:0 1px 2px rgba(23,23,23,.04), 0 6px 20px -6px rgba(23,23,23,.10);
    --r-sm:6px; --r:12px; --r-lg:16px; --r-full:9999px;
    --maxw:1120px;
    --font-body:'Inter',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    --font-display:'Source Serif 4','Iowan Old Style','Palatino Linotype',Georgia,serif;
    /* category hues — legible on both themes via color-mix */
    --cat-sunday:#2f6fed; --cat-course:#64748b; --cat-sunim:#ea580c;
    --cat-retreat:#059669; --cat-volunteer:#0d9488; --cat-family:#7c3aed;
    --cat-ceremony:#b45309; --cat-community:#6b7280;
  }

  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:var(--font-body); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:var(--maxw); margin:0 auto; padding:clamp(20px,4vw,44px)}
  a{color:inherit}

  /* masthead */
  .masthead{display:flex; align-items:center; flex-wrap:wrap; gap:14px 22px; margin-bottom:clamp(28px,5vw,52px)}
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; margin-right:auto}
  .brand-logo{flex:none; display:flex; align-items:center; background:#fff; border:1px solid rgba(0,0,0,.08); border-radius:8px; padding:6px 10px}
  .brand-logo img{display:block; height:22px; width:auto}
  .brand-sub{font-size:12.5px; line-height:1.25; color:var(--ink-3); padding-left:12px; border-left:1px solid var(--border)}
  .brand-sub b{display:block; font-weight:600; font-size:13.5px; color:var(--ink); letter-spacing:-.01em}
  .nav{display:flex; align-items:center; gap:4px; flex-wrap:wrap}
  .nav a{font-size:14px; font-weight:500; color:var(--ink-2); text-decoration:none; padding:8px 14px; border-radius:var(--r-full); transition:background .15s, color .15s}
  .nav a:hover{background:var(--surface); color:var(--ink)}
  .nav a[aria-current="page"]{background:var(--brand-tint); color:var(--brand-strong)}
  .nav a:focus-visible{outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 32%, transparent)}
  .lang-toggle{flex:none; display:inline-flex; background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-full); padding:3px}
  .lang-toggle button{font:inherit; font-size:13px; font-weight:600; line-height:1; border:none; background:none; color:var(--ink-3); padding:6px 12px; border-radius:var(--r-full); cursor:pointer; transition:background .15s, color .15s}
  .lang-toggle button[aria-pressed="true"]{background:var(--brand); color:#fff}
  .lang-toggle button:focus-visible{outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 32%, transparent)}

  /* intro */
  .eyebrow{font-size:13px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--brand-strong); margin:0 0 12px}
  h1{font-family:var(--font-display); font-weight:400; font-size:clamp(30px,5vw,46px); line-height:1.12; letter-spacing:-.015em; margin:0 0 14px; text-wrap:balance}
  .lede{font-size:clamp(16px,2.2vw,19px); color:var(--ink-2); max-width:54ch; margin:0}
  .intro{margin-bottom:clamp(24px,4vw,36px)}

  /* controls */
  .controls{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:24px}
  .segmented{display:inline-flex; background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-full); padding:3px}
  .segmented button{
    font:inherit; font-size:14px; font-weight:500; border:none; background:none; color:var(--ink-2);
    padding:7px 16px; border-radius:var(--r-full); cursor:pointer;
  }
  .segmented button[aria-pressed="true"]{background:var(--brand); color:#fff}
  .filter-wrap{position:relative; display:flex}
  .filter-wrap select{
    appearance:none; -webkit-appearance:none; font:inherit; font-size:14px; color:var(--ink);
    background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-full);
    padding:8px 34px 8px 14px; cursor:pointer;
  }
  .filter-wrap svg{position:absolute; right:11px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--ink-2)}
  .spacer{flex:1 1 auto}
  .btn{font:inherit; font-weight:500; border-radius:var(--r-full); cursor:pointer; padding:9px 18px; border:1px solid transparent; transition:background .15s,border-color .15s}
  .btn-ghost{background:var(--surface); color:var(--ink); border-color:var(--border-strong)}
  .btn-ghost:hover{border-color:var(--ink-3)}
  .btn-primary{background:var(--brand); color:#fff}
  .btn-primary:hover{background:var(--brand-strong)}
  .btn:focus-visible,.segmented button:focus-visible,select:focus-visible,.day:focus-visible,.event:focus-within{
    outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 32%, transparent)
  }

  /* category tag */
  .tag{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    padding:3px 10px 3px 8px; border-radius:var(--r-full); white-space:nowrap;
    background:color-mix(in oklab, var(--cat) 15%, var(--surface));
    color:color-mix(in oklab, var(--cat) 70%, var(--ink));
  }
  .tag::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--cat); flex:none}

  /* ─── list view ─── */
  .month-group{margin-bottom:32px}
  .month-label{
    font-family:var(--font-display); font-weight:400; font-size:22px; letter-spacing:-.01em;
    margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid var(--border);
  }
  .event-list{display:flex; flex-direction:column; gap:14px}
  .event{
    display:grid; grid-template-columns:64px 1fr; gap:18px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:18px 20px; box-shadow:var(--shadow-sm);
  }
  @media (max-width:560px){ .event{grid-template-columns:52px 1fr; gap:14px; padding:16px} }
  .date-chip{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r);
    padding:8px 4px; height:max-content;
  }
  .date-chip .m{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--brand-strong)}
  .date-chip .d{font-size:22px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums}
  .date-chip .wd{font-size:11px; color:var(--ink-3)}
  .event-main{display:flex; flex-direction:column; gap:7px; min-width:0}
  .event-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .event h3{font-size:17px; font-weight:600; margin:0; letter-spacing:-.01em}
  .event-meta{font-size:13px; color:var(--ink-3); display:flex; gap:8px; flex-wrap:wrap}
  .event-meta span{display:inline-flex; align-items:center; gap:5px}
  .event-desc{font-size:14px; color:var(--ink-2); margin:2px 0 0; overflow-wrap:anywhere}
  .event-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
  .event-actions a,.event-actions button{
    font:inherit; font-size:13px; font-weight:500; text-decoration:none; cursor:pointer;
    padding:6px 13px; border-radius:var(--r-full); border:1px solid var(--border-strong);
    background:var(--surface); color:var(--ink); display:inline-flex; align-items:center; gap:6px;
  }
  .event-actions a:hover,.event-actions button:hover{border-color:var(--ink-3)}
  .event-actions .go{background:var(--brand); border-color:var(--brand); color:#fff}
  .event-actions .go:hover{background:var(--brand-strong); border-color:var(--brand-strong)}

  /* volunteers-needed panel */
  .vol-panel{margin-top:10px; display:flex; flex-direction:column; gap:8px; background:var(--surface-2); border:1px dashed var(--brand); border-radius:var(--r); padding:12px 14px}
  .vol-panel-head{display:flex; align-items:center; gap:8px}
  .vol-panel-head .ico{font-size:14px; line-height:1}
  .vol-panel-head .t{font-size:13px; font-weight:600; color:var(--brand-strong)}
  .vol-help{margin:0; font-size:13px; color:var(--ink-2); line-height:1.5; overflow-wrap:anywhere}
  .vol-cta{align-self:flex-start; font:inherit; font-size:13px; font-weight:500; text-decoration:none; padding:7px 14px; border-radius:var(--r-full); border:1px solid var(--brand); color:var(--brand-strong); background:none; transition:background .15s}
  .vol-cta:hover{background:color-mix(in srgb, var(--brand) 12%, transparent)}

  .more-row{margin-top:8px}
  .empty{color:var(--ink-3); font-size:15px; padding:32px 0; text-align:center}

  /* ─── month view ─── */
  .cal-head{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .cal-title{font-family:var(--font-display); font-size:22px; font-weight:400; letter-spacing:-.01em; min-width:210px}
  .cal-nav{display:inline-flex; gap:6px}
  .icon-btn{
    width:34px; height:34px; display:grid; place-items:center; cursor:pointer;
    background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-full); color:var(--ink-2);
  }
  .icon-btn:hover{color:var(--ink); border-color:var(--ink-3)}
  .weekdays,.grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .weekdays{margin-bottom:6px}
  .weekdays span{font-size:12px; font-weight:600; color:var(--ink-3); text-align:center; padding:4px 0}
  .day{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
    min-height:96px; padding:6px 7px; display:flex; flex-direction:column; gap:4px;
    cursor:pointer; text-align:left; font:inherit; color:inherit; transition:border-color .12s;
  }
  .day:hover{border-color:var(--border-strong)}
  .day.out{background:var(--surface-2); color:var(--ink-3); cursor:default}
  .day.today .dnum{background:var(--brand); color:#fff}
  .day.sel{border-color:var(--brand); box-shadow:0 0 0 1px var(--brand)}
  .dnum{font-size:13px; font-weight:600; width:24px; height:24px; display:grid; place-items:center; border-radius:var(--r-full); font-variant-numeric:tabular-nums}
  .pill{
    font-size:11px; font-weight:500; line-height:1.3; padding:2px 6px; border-radius:5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    background:color-mix(in oklab, var(--cat) 16%, var(--surface));
    color:color-mix(in oklab, var(--cat) 72%, var(--ink));
    border-left:3px solid var(--cat);
  }
  .pill.more{background:none; border:none; color:var(--ink-3); padding-left:3px}
  @media (max-width:640px){
    .day{min-height:64px}
    .pill{font-size:0; padding:0; height:6px; border-radius:3px; border-left:none}
    .pill.more{font-size:10px; height:auto}
  }
  .day-detail{margin-top:22px}
  .day-detail h2{font-size:16px; font-weight:600; margin:0 0 12px}

  /* subscribe popover */
  .pop{
    position:absolute; z-index:30; right:0; margin-top:8px; width:min(340px,86vw);
    background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r);
    box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; gap:10px;
  }
  .pop h3{margin:0; font-size:15px; font-weight:600}
  .pop p{margin:0; font-size:13px; color:var(--ink-2)}
  .pop .feed{display:flex; gap:6px}
  .pop input{flex:1; font:inherit; font-size:12px; padding:7px 9px; border:1px solid var(--border-strong); border-radius:var(--r-sm); background:var(--surface-2); color:var(--ink-2); min-width:0}
  .pop .feed button{flex:none; font:inherit; font-size:13px; padding:7px 12px; border-radius:var(--r-sm); border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); cursor:pointer}
  .sub-holder{position:relative}

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(12px);
    background:var(--ink); color:var(--cream); padding:12px 20px; border-radius:var(--r-full);
    font-size:14px; box-shadow:var(--shadow); opacity:0; transition:opacity .2s,transform .2s;
    pointer-events:none; z-index:50; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>

  /* ── boot ── */
  (async function(){
    state.all = await load();
    var sel = $("#filterCat");
    var seen = {};
    // keep the CATS order first, then any extra categories from the sheet
    Object.keys(CATS).concat(state.all.map(function(e){ return e.category; }))
      .forEach(function(c){
        if(seen[c] || !state.all.some(function(e){ return e.category===c; })) return;
        seen[c] = 1;
        var o = document.createElement("option"); o.value = c; o.textContent = catLabel(c); o.setAttribute("data-cat", c); sel.appendChild(o);
      });
    setupSubscribe();
    setView("list");
    applyLang(lang);
  })();
})();
</script>

</body>
</html>
