<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title data-ko="사진 · 워싱턴미주정토회관" data-en="Gallery · Washington Jungto Center">사진 · 워싱턴미주정토회관</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --cream:#fff7ed; --surface:#ffffff; --surface-2:#fafafa;
    --ink:#171717; --ink-2:#4a5565; --ink-3:#99a1af;
    --brand:#fb923c; --brand-strong:#bb4d00; --brand-tint:#ffedd4;
    --border:#e5e7eb; --border-strong:#d1d5dc;
    --shadow-sm:0 1px 2px rgba(23,23,23,.05);
    --shadow:0 1px 2px rgba(23,23,23,.04), 0 6px 20px -6px rgba(23,23,23,.10);
    --shadow-lg:0 24px 60px -12px rgba(23,23,23,.4);
    --r-sm:6px; --r:12px; --r-lg:16px; --r-full:9999px;
    --maxw:1120px;
    --font-body:'Inter',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    --font-display:'Source Serif 4','Iowan Old Style','Palatino Linotype',Georgia,serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  body{margin:0; background:var(--cream); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased}
  .page{max-width:var(--maxw); margin:0 auto; padding:clamp(20px,4vw,44px)}
  a{color:inherit}

  .masthead{display:flex; align-items:center; flex-wrap:wrap; gap:14px 22px; margin-bottom:clamp(28px,5vw,52px)}
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; margin-right:auto}
  .brand-logo{flex:none; display:flex; align-items:center; background:#fff; border:1px solid rgba(0,0,0,.08); border-radius:8px; padding:6px 10px}
  .brand-logo img{display:block; height:22px; width:auto}
  .brand-sub{font-size:12.5px; line-height:1.25; color:var(--ink-3); padding-left:12px; border-left:1px solid var(--border)}
  .brand-sub b{display:block; font-weight:600; font-size:13.5px; color:var(--ink); letter-spacing:-.01em}
  .nav{display:flex; align-items:center; gap:4px; flex-wrap:wrap}
  .nav a{font-size:14px; font-weight:500; color:var(--ink-2); text-decoration:none; padding:8px 14px; border-radius:var(--r-full); transition:background .15s, color .15s}
  .nav a:hover{background:var(--surface); color:var(--ink)}
  .nav a[aria-current="page"]{background:var(--brand-tint); color:var(--brand-strong)}
  .nav a:focus-visible{outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 32%, transparent)}
  .lang-toggle{flex:none; display:inline-flex; background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-full); padding:3px}
  .lang-toggle button{font:inherit; font-size:13px; font-weight:600; line-height:1; border:none; background:none; color:var(--ink-3); padding:6px 12px; border-radius:var(--r-full); cursor:pointer; transition:background .15s, color .15s}
  .lang-toggle button[aria-pressed="true"]{background:var(--brand); color:#fff}
  .lang-toggle button:focus-visible{outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 32%, transparent)}

  .eyebrow{font-size:13px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--brand-strong); margin:0 0 12px}
  h1{font-family:var(--font-display); font-weight:400; font-size:clamp(30px,5vw,46px); line-height:1.12; letter-spacing:-.015em; margin:0 0 14px; text-wrap:balance}
  .lede{font-size:clamp(16px,2.2vw,19px); color:var(--ink-2); max-width:52ch; margin:0}
  .intro{margin-bottom:clamp(28px,5vw,44px)}

  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(16px,3vw,28px)}
  @media (max-width:760px){ .grid{grid-template-columns:1fr; max-width:460px; margin:0 auto} }
  figure{margin:0; display:flex; flex-direction:column; gap:10px}
  .shot{
    border:none; padding:0; margin:0; background:none; cursor:zoom-in;
    border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow);
    display:block; width:100%; aspect-ratio:4/3; transition:transform .18s ease, box-shadow .18s ease;
  }
  .shot img{display:block; width:100%; height:100%; object-fit:cover}
  .shot:hover{transform:translateY(-3px); box-shadow:0 14px 30px -10px rgba(23,23,23,.22)}
  .shot:focus-visible{outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 45%, transparent)}
  figcaption{font-size:14px; color:var(--ink-3); padding-left:2px}

  .skeleton{pointer-events:none}
  .skel{aspect-ratio:4/3; border-radius:var(--r-lg); background:var(--surface-2); animation:skelpulse 1.5s ease-in-out infinite}
  @keyframes skelpulse{0%,100%{opacity:1}50%{opacity:.5}}

  .note{margin-top:clamp(28px,5vw,44px); font-size:14px; color:var(--ink-3); max-width:52ch}

  /* lightbox */
  .lb{
    position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:clamp(16px,4vw,48px);
    background:rgba(15,18,25,.86); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .lb.open{opacity:1; pointer-events:auto}
  .lb img{max-width:min(1000px,92vw); max-height:78vh; width:auto; height:auto; border-radius:var(--r-lg); box-shadow:var(--shadow-lg)}
  .lb-cap{color:#f3f4f6; font-size:15px}
  .lb-close{
    position:absolute; top:16px; right:16px; width:44px; height:44px; border-radius:var(--r-full);
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff;
    display:grid; place-items:center; cursor:pointer;
  }
  .lb-close:hover{background:rgba(255,255,255,.22)}
  .lb-close:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(255,255,255,.5)}

  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>

  <div class="lb" id="lightbox" role="dialog" aria-modal="true" aria-label="사진 / Photo">
    <button class="lb-close" id="lbClose" aria-label="닫기" data-ko-al="닫기" data-en-al="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <img id="lbImg" src="" alt="">
    <p class="lb-cap" id="lbCap"></p>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };

  /* Same Apps Script URL as the other pages. When photos have been added
     through the Admin page, they replace the placeholder pictures below. */
  var CONFIG = { endpoint: "https://script.google.com/macros/s/AKfycbzKrSMecQPo_HCJRRXtzjtw5Np6-8sXLGcBbCLA8GGPyzTEff_OspFQkSegEod4PjKwNQ/exec" };

  /* ── lightbox ── */
  var lb = $("#lightbox"), lbImg = $("#lbImg"), lbCap = $("#lbCap"), lbClose = $("#lbClose");
  var lastFocused = null;
  function open(imgEl, cap){
    lastFocused = document.activeElement;
    lbImg.src = imgEl.currentSrc || imgEl.src;
    lbImg.alt = imgEl.alt;
    lbCap.textContent = cap || "";
    lb.classList.add("open");
    document.body.style.overflow = "hidden";
    lbClose.focus();
  }
  function close(){
    lb.classList.remove("open");
    document.body.style.overflow = "";
    lbImg.src = "";
    if (lastFocused) lastFocused.focus();
  }
  var grid = $("#grid"), skeleton = $("#gridSkeleton");
  grid.addEventListener("click", function(e){
    var btn = e.target.closest(".shot");
    if (btn) open(btn.querySelector("img"), btn.dataset.cap);
  });
  lbClose.addEventListener("click", close);

  /* ── load photos added through the Admin page ── */
  (async function(){
    if (!CONFIG.endpoint) return;              // no backend → keep the built-in pictures
    grid.hidden = true; skeleton.hidden = false;
    try {
      var res = await fetch(CONFIG.endpoint + (CONFIG.endpoint.indexOf("?") < 0 ? "?" : "&") + "resource=photos&t=" + Date.now());
      var data = await res.json();
      var photos = data.photos || [];
      if (photos.length) {
        grid.innerHTML = "";
        photos.forEach(function(p){
          var fig = document.createElement("figure");
          var cap = p.caption || "Washington Jungto Center";
          fig.innerHTML =
            '<button class="shot" type="button" data-cap="' + cap.replace(/"/g,"&quot;") + '">' +
              '<img loading="lazy" src="' + String(p.url).replace(/"/g,"&quot;") + '" alt="' + cap.replace(/"/g,"&quot;") + '">' +
            '</button>' +
            (p.caption ? '<figcaption>' + cap.replace(/</g,"&lt;") + '</figcaption>' : '');
          grid.appendChild(fig);
        });
      }
      // no photos yet → leave the built-in placeholder pictures in place
    } catch (e) { /* network error → keep the placeholder pictures */ }
    skeleton.hidden = true; grid.hidden = false;
  })();
  lb.addEventListener("click", function(e){ if (e.target === lb) close(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && lb.classList.contains("open")) close(); });

  /* ── language — Korean by default, English on toggle ── */
  var lang = "ko";
  try { var sv = localStorage.getItem("wjc_lang"); if (sv === "en" || sv === "ko") lang = sv; } catch(e){}
  function tset(el, l){
    var v = el.getAttribute("data-" + l);
    if (v == null) return;
    if (v.indexOf("<") >= 0) el.innerHTML = v; else el.textContent = v;
  }
  function applyLang(l){
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll("[data-ko]").forEach(function(el){ tset(el, l); });
    document.querySelectorAll("[data-ko-ph]").forEach(function(el){ el.setAttribute("placeholder", el.getAttribute("data-" + l + "-ph") || el.getAttribute("data-ko-ph")); });
    document.querySelectorAll("[data-ko-al]").forEach(function(el){ el.setAttribute("aria-label", el.getAttribute("data-" + l + "-al") || el.getAttribute("data-ko-al")); });
    var t = document.querySelector("title[data-ko]");
    if (t) document.title = t.getAttribute("data-" + l) || document.title;
    var kb = document.getElementById("langKo"), eb = document.getElementById("langEn");
    if (kb) kb.setAttribute("aria-pressed", l === "ko");
    if (eb) eb.setAttribute("aria-pressed", l === "en");
    document.dispatchEvent(new CustomEvent("wjc:lang", { detail: { lang: l } }));
  }
  function setLang(l){ try { localStorage.setItem("wjc_lang", l); } catch(e){} applyLang(l); }
  var _kb = document.getElementById("langKo"), _eb = document.getElementById("langEn");
  if (_kb) _kb.addEventListener("click", function(){ setLang("ko"); });
  if (_eb) _eb.addEventListener("click", function(){ setLang("en"); });
  applyLang(lang);
})();
</script>
